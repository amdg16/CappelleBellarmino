<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cappelle · Bellarmino</title>
<meta name="theme-color" content="#1B2236">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cappelle">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Alegreya:wght@500;700&family=Alegreya+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --stone:#E6E8EB; --paper:#FFFFFF; --ink:#1B2236; --muted:#5F6676;
    --rule:#D6DAE1; --rule-strong:#AEB5C2; --accent:#23408E; --past:#F1F2F4;
    --row:18px; --colw:128px; --timew:52px;
    font-family:"Alegreya Sans", "Segoe UI", system-ui, sans-serif;
    color:var(--ink); background:var(--stone);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{display:flex;flex-direction:column;
    padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0)}
  button,input,select{font:inherit;color:inherit}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  .top{padding:14px 16px 8px;display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px 20px}
  .title{flex:1 1 260px;min-width:0}
  .title small{display:block;color:var(--muted);font-size:14px}
  .title h1{margin:2px 0 0;font:700 clamp(26px,5vw,38px)/1.05 "Alegreya", Georgia, serif;letter-spacing:-.01em}
  .nav{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .nav button,.nav input,.nav select{border:1px solid var(--rule-strong);background:var(--paper);border-radius:8px;padding:6px 10px;min-height:36px;cursor:pointer}
  .nav .arrow{width:36px;padding:0;font-size:20px;line-height:1}
  .is-on{background:var(--ink)!important;color:#fff!important;border-color:var(--ink)!important}
  .floors{display:flex;gap:6px;overflow-x:auto;padding:0 16px 8px;scrollbar-width:none}
  .floors button{flex:none;border:1px solid var(--rule-strong);background:transparent;border-radius:999px;padding:4px 12px;min-height:32px;cursor:pointer;font-size:14px}
  .sync{padding:0 16px 6px;font-size:13px;color:var(--muted)}

  .scroller{flex:1;overflow:auto;margin:0 8px 8px;background:var(--paper);border:1px solid var(--rule-strong);border-radius:10px;-webkit-overflow-scrolling:touch}
  .grid{display:grid;position:relative;
    grid-template-columns:var(--timew) repeat(var(--cols),minmax(var(--colw),1fr));
    grid-template-rows:52px repeat(var(--n),var(--row))}
  .corner,.ch{position:sticky;top:0;z-index:3;background:var(--paper);border-bottom:1px solid var(--rule-strong)}
  .corner{left:0;z-index:4}
  .ch{grid-row:1;padding:6px 8px;border-left:1px solid var(--rule);line-height:1.15}
  .ch b{display:block;font-weight:700;font-size:14px}
  .ch small{display:block;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tm{grid-column:1;position:sticky;left:0;z-index:2;background:var(--paper);font-size:12px;color:var(--muted);
      padding-right:6px;text-align:right;transform:translateY(-7px)}
  .tm.hr{color:var(--ink);font-weight:700}
  .cell{border:0;border-left:1px solid var(--rule);border-top:1px solid transparent;background:transparent;padding:0;cursor:pointer;border-radius:0}
  .cell.half{border-top-color:var(--rule)}
  .cell.hr{border-top-color:var(--rule-strong)}
  @media (hover:hover){ .cell:hover{background:#E9EEF9} }
  .cell.past{background:var(--past);cursor:default}
  .bk{z-index:1;margin:1px 3px;border:0;border-left:4px solid hsl(var(--h) 45% 38%);border-radius:6px;
      background:hsl(var(--h) 55% 90%);text-align:left;padding:2px 6px;overflow:hidden;cursor:pointer;line-height:1.15}
  .bk b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bk span,.bk small{display:block;font-size:12px;color:#333a4a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .now{grid-column:2 / -1;height:0;border-top:2px solid #B3261E;z-index:2;pointer-events:none;align-self:start}
  .notice{padding:24px;max-width:60ch;line-height:1.5}

  dialog{border:0;border-radius:12px;padding:0;width:min(440px,94vw);color:var(--ink);box-shadow:0 18px 50px rgba(20,25,40,.35)}
  dialog::backdrop{background:rgba(20,25,40,.45)}
  .dlg{padding:18px 18px 14px}
  .dlg h2{margin:0 0 2px;font:700 22px/1.2 "Alegreya", Georgia, serif}
  .dlg .sub{margin:0 0 14px;color:var(--muted);font-size:14px}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  label{display:block;font-size:13px;color:var(--muted);margin:0 0 10px}
  label > input,label > select{display:block;width:100%;margin-top:3px;border:1px solid var(--rule-strong);border-radius:8px;padding:7px 8px;background:#fff;min-height:38px;font-size:16px}
  .warn{min-height:20px;font-size:14px;color:#B3261E;margin:2px 0 8px}
  .actions{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:8px;margin-top:6px}
  .btn{border:1px solid var(--rule-strong);background:#fff;border-radius:8px;padding:8px 14px;cursor:pointer;min-height:40px}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.danger{color:#B3261E;border-color:#E3B4B0}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  dl{margin:0 0 12px;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:15px}
  dt{color:var(--muted)}dd{margin:0}

  #toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0));transform:translateX(-50%);background:var(--ink);color:#fff;
    padding:10px 14px;border-radius:10px;font-size:14px;max-width:92vw;opacity:0;pointer-events:none;transition:opacity .2s}
  #toast.show{opacity:1}
  @media (max-width:600px){
    :root{--colw:108px;--timew:44px}
    .top{padding:10px 10px 6px} .floors,.sync{padding-left:10px;padding-right:10px} .scroller{margin:0 4px 4px}
  }
  @media (prefers-reduced-motion:reduce){ #toast{transition:none} }
</style>
</head>
<body>
<header class="top">
  <div class="title">
    <small data-t="brand"></small>
    <h1 id="dayLabel">…</h1>
  </div>
  <nav class="nav">
    <button class="arrow" id="prev">‹</button>
    <input type="date" id="date">
    <button class="arrow" id="next">›</button>
    <button id="today" data-t="today"></button>
    <button id="wed" data-t="wed"></button>
    <select id="lang" aria-label="Lingua / Language">
      <option value="it">Italiano</option>
      <option value="en">English</option>
      <option value="fr">Français</option>
      <option value="es">Español</option>
    </select>
  </nav>
</header>
<div class="floors" id="floors"></div>
<div class="sync" id="sync" aria-live="polite"></div>

<div class="scroller" id="scroller"><div class="grid" id="grid"></div></div>

<dialog id="bookDlg">
  <form class="dlg" method="dialog">
    <h2 data-t="bookTitle"></h2>
    <p class="sub" id="bookSub"></p>
    <label><span data-t="chapel"></span> <select id="fChapel"></select></label>
    <div class="row">
      <label><span data-t="start"></span> <select id="fStart"></select></label>
      <label><span data-t="duration"></span> <select id="fDur"></select></label>
    </div>
    <label><span data-t="group"></span> <select id="fGroup"></select></label>
    <label><span data-t="name"></span> <input id="fName" maxlength="60" autocomplete="name"></label>
    <label><span data-t="note"></span> <input id="fNote" maxlength="200"></label>
    <div class="warn" id="warn"></div>
    <div class="actions">
      <button type="button" class="btn" id="bookCancel" data-t="cancel"></button>
      <button type="button" class="btn primary" id="bookOk" data-t="bookBtn"></button>
    </div>
  </form>
</dialog>

<dialog id="infoDlg">
  <div class="dlg">
    <h2 id="iGroup"></h2>
    <p class="sub" id="iWhen"></p>
    <dl id="iList"></dl>
    <div class="actions">
      <button type="button" class="btn danger" id="iDel" data-t="delete"></button>
      <button type="button" class="btn primary" id="iClose" data-t="close"></button>
    </div>
  </div>
</dialog>

<div id="toast" role="status"></div>

<script>
/* ▼▼▼ Incolla qui l'URL del deployment di Apps Script (finisce con /exec) ▼▼▼ */
const API = 'https://script.google.com/macros/s/AKfycbxUZXH2XNpQies6jE_vw9wRjz1PKDo6QzZFH0t06Gz78uGsTBJ2ayI__QhuIx_4NYXzAQ/exec';
/* ▲▲▲ ------------------------------------------------------------------ ▲▲▲ */

/* ---------- Traduzioni ---------- */
const I18N = {
  it: {
    brand:'Cappelle · Collegio San Roberto Bellarmino', today:'Oggi', wed:'Mercoledì',
    prev:'Giorno precedente', next:'Giorno successivo', all:'Tutte',
    loading:'Caricamento…', updated:'Aggiornato alle {t} · si aggiorna da solo ogni 30 secondi',
    offline:'Connessione non riuscita. Riprovo tra poco.',
    bookTitle:'Prenota', chapel:'Cappella', start:'Inizio', duration:'Durata', group:'Gruppo', choose:'Scegli…',
    name:'Il tuo nome', note:'Nota (facoltativa)', cancel:'Annulla', bookBtn:'Prenota', booking:'Prenotazione…',
    booked:'Prenotata.', delete:'Cancella prenotazione', deleted:'Cancellata.', confirmDel:'Cancellare questa prenotazione?',
    close:'Chiudi', bookedBy:'Prenotata da', noteLbl:'Nota',
    taken:'Occupata da {0} ({1}–{2}).', tooLate:'Termina dopo le {t}: scegli una durata più breve.',
    past:'Questo orario è già passato.', needGroup:'Scegli il gruppo.', needName:'Scrivi il tuo nome.',
    f0:'Pianterreno', f2:'2° piano', f2i:'Secondo intermedio', f3:'3° piano',
    E_DATE:'Data non valida.', E_PAST:'Non si può prenotare nel passato.', E_CHAPEL:'Cappella non valida.',
    E_START:'Orario di inizio non valido.', E_DUR:'Durata non valida.', E_RANGE:'Orario fuori dalla fascia consentita.',
    E_GROUP:'Scegli il gruppo.', E_NAME:'Scrivi il tuo nome.',
    E_NOTFOUND:'Prenotazione non trovata: forse è già stata cancellata.',
    E_BUSY:'Troppe richieste insieme. Riprova tra qualche secondo.',
    E_NET:'Connessione non riuscita. Controlla la rete e riprova.', E_GENERIC:'Operazione non riuscita. Riprova.'
  },
  en: {
    brand:'Chapels · Collegio San Roberto Bellarmino', today:'Today', wed:'Wednesday',
    prev:'Previous day', next:'Next day', all:'All',
    loading:'Loading…', updated:'Updated at {t} · refreshes every 30 seconds',
    offline:'Connection failed. Retrying shortly.',
    bookTitle:'Book', chapel:'Chapel', start:'Start', duration:'Duration', group:'Group', choose:'Choose…',
    name:'Your name', note:'Note (optional)', cancel:'Cancel', bookBtn:'Book', booking:'Booking…',
    booked:'Booked.', delete:'Delete booking', deleted:'Deleted.', confirmDel:'Delete this booking?',
    close:'Close', bookedBy:'Booked by', noteLbl:'Note',
    taken:'Taken by {0} ({1}–{2}).', tooLate:'Ends after {t}: choose a shorter duration.',
    past:'This time has already passed.', needGroup:'Choose a group.', needName:'Enter your name.',
    f0:'Ground floor', f2:'2nd floor', f2i:'2nd floor, intermediate level', f3:'3rd floor',
    E_DATE:'Invalid date.', E_PAST:'Bookings in the past are not allowed.', E_CHAPEL:'Invalid chapel.',
    E_START:'Invalid start time.', E_DUR:'Invalid duration.', E_RANGE:'Time outside the allowed hours.',
    E_GROUP:'Choose a group.', E_NAME:'Enter your name.',
    E_NOTFOUND:'Booking not found: it may already have been deleted.',
    E_BUSY:'Too many requests at once. Try again in a few seconds.',
    E_NET:'Connection failed. Check your network and try again.', E_GENERIC:'Something went wrong. Try again.'
  },
  fr: {
    brand:'Chapelles · Collegio San Roberto Bellarmino', today:'Aujourd’hui', wed:'Mercredi',
    prev:'Jour précédent', next:'Jour suivant', all:'Toutes',
    loading:'Chargement…', updated:'Mis à jour à {t} · actualisation toutes les 30 secondes',
    offline:'Connexion impossible. Nouvel essai dans un instant.',
    bookTitle:'Réserver', chapel:'Chapelle', start:'Début', duration:'Durée', group:'Groupe', choose:'Choisir…',
    name:'Votre nom', note:'Note (facultative)', cancel:'Annuler', bookBtn:'Réserver', booking:'Réservation…',
    booked:'Réservée.', delete:'Supprimer la réservation', deleted:'Supprimée.', confirmDel:'Supprimer cette réservation ?',
    close:'Fermer', bookedBy:'Réservée par', noteLbl:'Note',
    taken:'Occupée par {0} ({1}–{2}).', tooLate:'Se termine après {t} : choisissez une durée plus courte.',
    past:'Cet horaire est déjà passé.', needGroup:'Choisissez un groupe.', needName:'Indiquez votre nom.',
    f0:'Rez-de-chaussée', f2:'2e étage', f2i:'2e étage, niveau intermédiaire', f3:'3e étage',
    E_DATE:'Date non valide.', E_PAST:'Impossible de réserver dans le passé.', E_CHAPEL:'Chapelle non valide.',
    E_START:'Heure de début non valide.', E_DUR:'Durée non valide.', E_RANGE:'Horaire en dehors de la plage autorisée.',
    E_GROUP:'Choisissez un groupe.', E_NAME:'Indiquez votre nom.',
    E_NOTFOUND:'Réservation introuvable : elle a peut-être déjà été supprimée.',
    E_BUSY:'Trop de demandes simultanées. Réessayez dans quelques secondes.',
    E_NET:'Connexion impossible. Vérifiez le réseau et réessayez.', E_GENERIC:'L’opération a échoué. Réessayez.'
  },
  es: {
    brand:'Capillas · Collegio San Roberto Bellarmino', today:'Hoy', wed:'Miércoles',
    prev:'Día anterior', next:'Día siguiente', all:'Todas',
    loading:'Cargando…', updated:'Actualizado a las {t} · se actualiza cada 30 segundos',
    offline:'Error de conexión. Reintentando en breve.',
    bookTitle:'Reservar', chapel:'Capilla', start:'Inicio', duration:'Duración', group:'Grupo', choose:'Elegir…',
    name:'Tu nombre', note:'Nota (opcional)', cancel:'Cancelar', bookBtn:'Reservar', booking:'Reservando…',
    booked:'Reservada.', delete:'Eliminar reserva', deleted:'Eliminada.', confirmDel:'¿Eliminar esta reserva?',
    close:'Cerrar', bookedBy:'Reservada por', noteLbl:'Nota',
    taken:'Ocupada por {0} ({1}–{2}).', tooLate:'Termina después de las {t}: elige una duración más corta.',
    past:'Esta hora ya ha pasado.', needGroup:'Elige un grupo.', needName:'Escribe tu nombre.',
    f0:'Planta baja', f2:'2.ª planta', f2i:'2.ª planta, nivel intermedio', f3:'3.ª planta',
    E_DATE:'Fecha no válida.', E_PAST:'No se puede reservar en el pasado.', E_CHAPEL:'Capilla no válida.',
    E_START:'Hora de inicio no válida.', E_DUR:'Duración no válida.', E_RANGE:'Horario fuera de la franja permitida.',
    E_GROUP:'Elige un grupo.', E_NAME:'Escribe tu nombre.',
    E_NOTFOUND:'Reserva no encontrada: quizá ya fue eliminada.',
    E_BUSY:'Demasiadas solicitudes a la vez. Inténtalo de nuevo en unos segundos.',
    E_NET:'Error de conexión. Revisa la red e inténtalo de nuevo.', E_GENERIC:'La operación no se pudo completar. Inténtalo de nuevo.'
  }
};
const LOCALE = { it:'it-IT', en:'en-GB', fr:'fr-FR', es:'es-ES' };
let lang = 'it';
function T(key, vars){
  let s = (I18N[lang] && I18N[lang][key]) || I18N.it[key] || key;
  if (vars) Object.keys(vars).forEach(k => { s = s.split('{' + k + '}').join(vars[k]); });
  return s;
}
function errText(err){
  const m = /E_[A-Z]+(\|[^\n]*)?/.exec(String(err && err.message || ''));
  if (!m) return T('E_GENERIC');
  const parts = m[0].split('|');
  if (parts[0] === 'E_TAKEN') return T('taken', { 0: parts[1], 1: parts[2], 2: parts[3] });
  return T(parts[0]);
}

/* ---------- Collegamento con Apps Script ---------- */
async function apiGet(params){
  const url = API + '?' + new URLSearchParams(Object.assign({}, params, { _: Date.now() }));
  let r; try { r = await fetch(url, { cache: 'no-store' }); } catch(e){ throw new Error('E_NET'); }
  let j; try { j = await r.json(); } catch(e){ throw new Error('E_NET'); }
  if (!j.ok) throw new Error(j.error || 'E_GENERIC');
  return j.data;
}
async function apiPost(body){
  // senza Content-Type esplicito il browser usa text/plain: nessuna richiesta preliminare CORS
  let r; try { r = await fetch(API, { method: 'POST', body: JSON.stringify(body) }); } catch(e){ throw new Error('E_NET'); }
  let j; try { j = await r.json(); } catch(e){ throw new Error('E_NET'); }
  if (!j.ok) throw new Error(j.error || 'E_GENERIC');
  return j.data;
}

/* ---------- Utilità ---------- */
const $ = s => document.querySelector(s);
const pad = n => String(n).padStart(2, '0');
const toMin = t => { const p = String(t).split(':').map(Number); return p[0] * 60 + p[1]; };
const toHM = m => pad(Math.floor(m / 60)) + ':' + pad(m % 60);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store = {
  get(k){ try { return localStorage.getItem('cap.' + k) || ''; } catch(e){ return ''; } },
  set(k,v){ try { localStorage.setItem('cap.' + k, v); } catch(e){} }
};
function todayISO(){ const d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()); }
function addDays(s, n){ const p = s.split('-').map(Number); return new Date(Date.UTC(p[0], p[1]-1, p[2]+n)).toISOString().slice(0,10); }
function dow(s){ const p = s.split('-').map(Number); return new Date(Date.UTC(p[0], p[1]-1, p[2])).getUTCDay(); }
function nextWed(s){ return addDays(s, (3 - dow(s) + 7) % 7); }
function longDate(s){
  const p = s.split('-').map(Number);
  const txt = new Intl.DateTimeFormat(LOCALE[lang], { weekday:'long', day:'numeric', month:'long', timeZone:'UTC' })
    .format(new Date(Date.UTC(p[0], p[1]-1, p[2])));
  return txt.charAt(0).toUpperCase() + txt.slice(1);
}
function nowMinFor(d){
  const t = todayISO();
  if (d < t) return Infinity;
  if (d > t) return -Infinity;
  const n = new Date(); return n.getHours()*60 + n.getMinutes();
}

/* ---------- Stato ---------- */
let CFG = null, START = 0, END = 0, STEP = 15, N = 0;
let current = todayISO();
let bookings = [];
let scrollToFocus = true;
let loadSeq = 0;
let lastSync = null;          // null | 'loading' | 'offline' | minuti
let floorFilter = store.get('floor') || 'all';
let openId = null;
let cfgFresh = false;          // la configurazione viene riletta dal server una volta per apertura

function setCfg(cfg){
  CFG = cfg;
  START = toMin(CFG.dayStart); END = toMin(CFG.dayEnd); STEP = CFG.step; N = (END - START) / STEP;
  store.set('cfg', JSON.stringify(cfg));
  fillForm(); renderFloors(); render();
}
const floorKey = c => String(c.floor).replace('i', '');     // '2i' resta con il 2° piano nei filtri
function floorText(c){ return T('f' + c.floor) + (c.extra ? ' · ' + c.extra : ''); }
function chapelName(id){ const c = CFG.chapels.find(c => c.id === id); return c ? c.short : id; }
function visibleChapels(){
  return CFG.chapels.map((c, i) => ({ c, i })).filter(x => floorFilter === 'all' || floorKey(x.c) === floorFilter);
}
function hueFor(g){
  const i = CFG.groups.indexOf(g);
  if (i >= 0) return Math.round(i * 360 / CFG.groups.length);
  let h = 0; for (const ch of g) h = (h * 31 + ch.charCodeAt(0)) % 360; return h;
}

/* ---------- Caricamento e disegno ---------- */
async function load(silent){
  const d = current, seq = ++loadSeq;
  if (!silent){ lastSync = 'loading'; showSync(); }
  try {
    const res = await apiGet({ action: cfgFresh ? 'day' : 'init', date: d });
    if (seq !== loadSeq) return;
    if (res.cfg){ setCfg(res.cfg); cfgFresh = true; }
    bookings = res.bookings || [];
    render();
    const n = new Date(); lastSync = n.getHours()*60 + n.getMinutes();
  } catch(e){
    if (seq !== loadSeq) return;
    lastSync = 'offline';
  }
  showSync();
}
function showSync(){
  $('#sync').textContent = lastSync === 'loading' ? T('loading')
    : lastSync === 'offline' ? T('offline')
    : lastSync == null ? '' : T('updated', { t: toHM(lastSync) });
}

function renderFloors(){
  if (!CFG) return;
  const keys = [];
  CFG.chapels.forEach(c => { const k = floorKey(c); if (!keys.includes(k)) keys.push(k); });
  if (floorFilter !== 'all' && !keys.includes(floorFilter)) floorFilter = 'all';
  $('#floors').innerHTML = [['all', T('all')]].concat(keys.map(k => [k, T('f' + k)]))
    .map(([k, l]) => `<button data-floor="${esc(k)}" class="${k === floorFilter ? 'is-on' : ''}">${esc(l)}</button>`).join('');
}

function render(){
  if (!CFG) return;
  const sc = $('#scroller'), grid = $('#grid');
  const keepTop = sc.scrollTop, keepLeft = sc.scrollLeft;
  const vis = visibleChapels();
  grid.style.setProperty('--cols', vis.length);
  grid.style.setProperty('--n', N);
  const now = nowMinFor(current);
  let h = '<div class="corner"></div>';
  vis.forEach(({ c }, k) => {
    h += `<div class="ch" style="grid-column:${k+2}"><b>${esc(c.short)}</b><small>${esc(floorText(c))}</small></div>`;
  });
  for (let s = 0; s < N; s++){
    const t = START + s*STEP, row = s + 2;
    const cls = t % 60 === 0 ? 'hr' : (t % 30 === 0 ? 'half' : 'q');
    h += `<div class="tm ${cls}" style="grid-row:${row}">${t % 30 === 0 ? toHM(t) : ''}</div>`;
    const past = t + STEP <= now;
    vis.forEach(({ c, i }, k) => {
      h += `<button class="cell ${cls}${past ? ' past' : ''}" style="grid-row:${row};grid-column:${k+2}" data-c="${i}" data-t="${t}"${past ? ' disabled' : ''} aria-label="${esc(c.short)} ${toHM(t)}"></button>`;
    });
  }
  bookings.forEach(b => {
    const k = vis.findIndex(x => x.c.id === b.chapel);
    if (k < 0) return;
    const s = Math.max(0, (toMin(b.start) - START) / STEP);
    const e = Math.min(N, (toMin(b.end) - START) / STEP);
    if (e <= s) return;
    h += `<button class="bk" data-id="${esc(b.id)}" style="grid-row:${s+2} / ${e+2};grid-column:${k+2};--h:${hueFor(b.group)}">`
       + `<b>${esc(b.group)}</b><span>${esc(b.start)}–${esc(b.end)}</span>${e - s >= 3 ? `<small>${esc(b.name)}</small>` : ''}</button>`;
  });
  if (now > START && now < END){
    const pos = (now - START) / STEP;
    h += `<div class="now" style="grid-row:${Math.floor(pos) + 2};margin-top:${(pos % 1) * 18}px"></div>`;
  }
  grid.innerHTML = h;
  if (scrollToFocus){ sc.scrollTop = (toMin(CFG.focus) - START) / STEP * 18; scrollToFocus = false; }
  else { sc.scrollTop = keepTop; sc.scrollLeft = keepLeft; }
}

function setDate(d){
  current = d; scrollToFocus = true; bookings = [];
  $('#date').value = d;
  updateHeader();
  render(); load();
}
function updateHeader(){
  $('#dayLabel').textContent = longDate(current);
  $('#today').classList.toggle('is-on', current === todayISO());
  $('#wed').classList.toggle('is-on', current === nextWed(todayISO()));
}
function toast(t){ const el = $('#toast'); el.textContent = t; el.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('show'), 4500); }

/* ---------- Lingua e modulo ---------- */
function fillSelect(sel, items){
  const keep = sel.value;
  sel.innerHTML = items.map(([v, l]) => `<option value="${esc(v)}">${esc(l)}</option>`).join('');
  if (keep && items.some(([v]) => String(v) === keep)) sel.value = keep;
}
function fillForm(){
  if (!CFG) return;
  fillSelect($('#fChapel'), CFG.chapels.map(c => [c.id, c.short + ' — ' + floorText(c)]));
  const starts = []; for (let t = START; t < END; t += STEP) starts.push([toHM(t), toHM(t)]);
  fillSelect($('#fStart'), starts);
  const durs = []; for (let d = CFG.minDur; d <= CFG.maxDur; d += STEP)
    durs.push([d, d < 60 ? d + ' min' : Math.floor(d/60) + ' h' + (d % 60 ? ' ' + d % 60 + ' min' : '')]);
  fillSelect($('#fDur'), durs);
  fillSelect($('#fGroup'), [['', T('choose')]].concat(CFG.groups.map(g => [g, g])));
}
function setLang(l){
  lang = I18N[l] ? l : 'it';
  store.set('lang', lang);
  $('#lang').value = lang;
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-t]').forEach(el => { el.textContent = T(el.dataset.t); });
  $('#prev').setAttribute('aria-label', T('prev'));
  $('#next').setAttribute('aria-label', T('next'));
  fillForm(); renderFloors(); updateHeader(); showSync(); render();
  if ($('#bookDlg').open){ $('#bookSub').textContent = longDate(current); check(); }
  if ($('#infoDlg').open && openId) fillInfo(openId);
}
function initialLang(){
  const saved = store.get('lang'); if (I18N[saved]) return saved;
  const nav = (navigator.language || 'it').slice(0, 2).toLowerCase();
  return I18N[nav] ? nav : 'it';
}

/* ---------- Prenotazione ---------- */
function openBook(ci, t){
  $('#fChapel').value = CFG.chapels[ci].id;
  $('#fStart').value = toHM(t);
  $('#fDur').value = 30;
  const g = store.get('group');
  $('#fGroup').value = CFG.groups.includes(g) ? g : '';
  $('#fName').value = store.get('name');
  $('#fNote').value = '';
  $('#bookSub').textContent = longDate(current);
  check();
  $('#bookDlg').showModal();
}
function formData(){
  return {
    action: 'book', date: current,
    chapel: $('#fChapel').value, start: $('#fStart').value, duration: Number($('#fDur').value),
    group: $('#fGroup').value, name: $('#fName').value.trim(), note: $('#fNote').value.trim()
  };
}
function check(){
  const f = formData(), s = toMin(f.start), e = s + f.duration;
  let msg = '';
  if (e > END) msg = T('tooLate', { t: CFG.dayEnd });
  else if (s + STEP <= nowMinFor(current)) msg = T('past');
  else {
    const c = bookings.find(b => b.chapel === f.chapel && toMin(b.start) < e && s < toMin(b.end));
    if (c) msg = T('taken', { 0: c.group, 1: c.start, 2: c.end });
  }
  $('#warn').textContent = msg;
  $('#bookOk').disabled = !!msg;
  return !msg;
}
['#fChapel','#fStart','#fDur'].forEach(id => $(id).addEventListener('change', check));
$('#bookCancel').addEventListener('click', () => $('#bookDlg').close());

$('#bookOk').addEventListener('click', async () => {
  if (!check()) return;
  const f = formData();
  if (!f.group){ $('#warn').textContent = T('needGroup'); return; }
  if (!f.name){ $('#warn').textContent = T('needName'); return; }
  store.set('group', f.group); store.set('name', f.name);
  const btn = $('#bookOk'); btn.disabled = true; btn.textContent = T('booking');
  try {
    await apiPost(f);
    $('#bookDlg').close(); toast(T('booked'));
  } catch(err){
    $('#warn').textContent = errText(err);
  }
  btn.textContent = T('bookBtn'); btn.disabled = false;
  load(true);
});

/* ---------- Dettagli e cancellazione ---------- */
function fillInfo(id){
  const b = bookings.find(x => x.id === id); if (!b) return false;
  $('#iGroup').textContent = b.group;
  $('#iWhen').textContent = longDate(b.date) + ', ' + b.start + '–' + b.end;
  $('#iList').innerHTML =
    `<dt>${esc(T('chapel'))}</dt><dd>${esc(chapelName(b.chapel))}</dd>` +
    `<dt>${esc(T('bookedBy'))}</dt><dd>${esc(b.name)}</dd>` +
    (b.note ? `<dt>${esc(T('noteLbl'))}</dt><dd>${esc(b.note)}</dd>` : '');
  $('#iDel').hidden = toMin(b.end) <= nowMinFor(b.date);
  return true;
}
function openInfo(id){ openId = id; if (fillInfo(id)) $('#infoDlg').showModal(); }

$('#iDel').addEventListener('click', async () => {
  if (!confirm(T('confirmDel'))) return;
  const btn = $('#iDel'); btn.disabled = true;
  try { await apiPost({ action: 'cancel', id: openId, by: store.get('name') }); toast(T('deleted')); }
  catch(err){ toast(errText(err)); }
  btn.disabled = false; $('#infoDlg').close(); load(true);
});
$('#iClose').addEventListener('click', () => $('#infoDlg').close());

/* ---------- Eventi ---------- */
$('#grid').addEventListener('click', e => {
  const bk = e.target.closest('.bk'); if (bk){ openInfo(bk.dataset.id); return; }
  const cell = e.target.closest('.cell'); if (cell && !cell.disabled) openBook(Number(cell.dataset.c), Number(cell.dataset.t));
});
$('#floors').addEventListener('click', e => {
  const b = e.target.closest('[data-floor]'); if (!b) return;
  floorFilter = b.dataset.floor; store.set('floor', floorFilter);
  renderFloors(); render();
});
$('#prev').addEventListener('click', () => setDate(addDays(current, -1)));
$('#next').addEventListener('click', () => setDate(addDays(current, 1)));
$('#today').addEventListener('click', () => setDate(todayISO()));
$('#wed').addEventListener('click', () => setDate(nextWed(todayISO())));
$('#date').addEventListener('change', e => { if (e.target.value) setDate(e.target.value); });
$('#lang').addEventListener('change', e => setLang(e.target.value));

const dialogOpen = () => $('#bookDlg').open || $('#infoDlg').open;
setInterval(() => { if (!document.hidden && !dialogOpen()) load(true); }, 30000);
document.addEventListener('visibilitychange', () => { if (!document.hidden && !dialogOpen()) load(true); });

/* ---------- Avvio ---------- */
(function start(){
  setLang(initialLang());
  if (!/^https:\/\/script\.google\.com\//.test(API)){
    $('#scroller').innerHTML = '<p class="notice">Manca l’indirizzo del servizio: incolla l’URL /exec di Apps Script nella costante API di index.html.</p>';
    return;
  }
  try { const c = JSON.parse(store.get('cfg') || 'null'); if (c && c.chapels) setCfg(c); } catch(e){}
  setDate(todayISO());
})();
</script>
</body>
</html>
